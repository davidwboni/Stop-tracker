name: Validate Stop Tracker Preview

on:
  push:
    branches:
      - feat/product-analytics-motion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build app
        shell: bash
        run: |
          rm -rf build
          npm run build
          test -f build/index.html
          test -d build/static/js
