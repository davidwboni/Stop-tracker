name: Diagnose Firebase callable runtime permissions
on:
  push:
    branches:
      - diagnose/firebase-premium-status-20261021
    paths:
      - .github/workflows/firebase-premium-diagnostics.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOP_TRACKER_V1 }}
          project_id: stop-tracker-v1
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read callable runtime identity and deployment state
        shell: bash
        run: |
          set -euo pipefail
          for fn in getPremiumStatus getReceiptStatus extractStatement; do
            echo "--- $fn ---"
            gcloud functions describe "$fn" --gen2 --region=us-central1 --project=stop-tracker-v1 --format=json |
              jq '{state: .state, runtimeServiceAccount: .serviceConfig.serviceAccountEmail, availableMemory: .serviceConfig.availableMemory, ingress: .serviceConfig.ingressSettings, uriConfigured: (.serviceConfig.uri != null)}'
          done
      - name: Check error log access without printing customer data
        shell: bash
        run: |
          set +e
          response="$(gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="getpremiumstatus" AND severity>=ERROR' --project=stop-tracker-v1 --limit=4 --format=json 2>&1)"
          status=$?
          if [ "$status" -eq 0 ]; then
            printf '%s' "$response" | jq '[.[] | {severity: .severity, timestamp: .timestamp, statusCode: .httpRequest.status, hasErrorMessage: (.textPayload != null or .jsonPayload != null)}]'
          else
            echo "Cloud Logging read unavailable for deployment account (no customer data printed)."
            printf '%s' "$response" | sed -n '/PERMISSION_DENIED/p' | head -c 320
            echo
          fi
