name: Diagnose Firebase callable runtime permissions
on:
  push:
    branches:
      - diagnose/firebase-premium-status-20261021
    paths:
      - .github/workflows/firebase-premium-diagnostics.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOP_TRACKER_V1 }}
          project_id: stop-tracker-v1
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read callable runtime identity and deployment state
        shell: bash
        run: |
          set -euo pipefail
          for fn in getPremiumStatus getReceiptStatus extractStatement; do
            echo "--- $fn ---"
            gcloud functions describe "$fn" --gen2 --region=us-central1 --project=stop-tracker-v1 --format=json |
              jq '{state: .state, runtimeServiceAccount: .serviceConfig.serviceAccountEmail, availableMemory: .serviceConfig.availableMemory, ingress: .serviceConfig.ingressSettings, uriConfigured: (.serviceConfig.uri != null)}'
          done
      - name: Probe callable endpoint invocation and CORS without customer credentials
        shell: bash
        run: |
          set -euo pipefail
          for fn in getPremiumStatus getReceiptStatus; do
            url="$(gcloud functions describe "$fn" --gen2 --region=us-central1 --project=stop-tracker-v1 --format='value(serviceConfig.uri)')"
            echo "--- $fn unauthenticated callable probe ---"
            result="$(mktemp)"
            status="$(curl --max-time 20 --silent --show-error --output "$result" --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{"data":{}}' "$url" || true)"
            echo "HTTP $status"
            jq -c '{status: .error.status, message: .error.message}' "$result" 2>/dev/null | head -c 240 || true
            echo
            rm -f "$result"
            result="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl --max-time 20 --silent --show-error --output "$result" --dump-header "$headers" --write-out '%{http_code}' -X OPTIONS -H 'Origin: https://stop-tracker.vercel.app' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type,authorization' "$url" || true)"
            echo "CORS preflight HTTP $status"
            grep -i '^access-control-allow-origin:' "$headers" | tr -d '\r' | head -c 150 || true
            echo
            rm -f "$result" "$headers"
            echo "Cloud Run IAM public invoker (if permitted):"
            iam="$(gcloud run services get-iam-policy "$(echo "$fn" | tr '[:upper:]' '[:lower:]')" --region=us-central1 --project=stop-tracker-v1 --format=json 2>/dev/null)"
            if [ $? -eq 0 ] && [ -n "$iam" ]; then
              printf '%s' "$iam" | jq -c '[.bindings[]? | select(.role == "roles/run.invoker") | .members[]? | select(.=="allUsers")] | length > 0'
            else
              echo "IAM policy not readable by deployment identity"
            fi
          done
      - name: Repair callable HTTP invocation for receipt AI (Firebase auth remains mandatory)
        shell: bash
        run: |
          set -euo pipefail
          for service in getreceiptstatus extractexpensereceipt; do
            echo "Granting unauthenticated Cloud Run transport access to $service; callable handler enforces Firebase Auth."
            gcloud run services add-iam-policy-binding "$service" --region=us-central1 --project=stop-tracker-v1 --member=allUsers --role=roles/run.invoker --quiet
            policy="$(gcloud run services get-iam-policy "$service" --region=us-central1 --project=stop-tracker-v1 --format=json)"
            printf '%s' "$policy" | jq -e '[.bindings[]? | select(.role=="roles/run.invoker") | .members[]? | select(.=="allUsers")] | length>0' >/dev/null
            echo "Confirmed public HTTP transport permission on $service"
          done
      - name: Confirm both receipt endpoints still require Firebase login
        shell: bash
        run: |
          set -euo pipefail
          for fn in getReceiptStatus extractExpenseReceipt; do
            url="$(gcloud functions describe "$fn" --gen2 --region=us-central1 --project=stop-tracker-v1 --format='value(serviceConfig.uri)')"
            output="$(mktemp)"
            status="$(curl --max-time 25 --silent --show-error --output "$output" --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{"data":{}}' "$url")"
            echo "$fn HTTP $status (unsigned must be 401)"
            if [ "$status" != "401" ]; then
              jq -c '{error: .error.status}' "$output" 2>/dev/null || true
              rm -f "$output"
              exit 1
            fi
            rm -f "$output"
          done
      - name: Read-only callable check with a disposable anonymous Firebase identity
        shell: bash
        run: |
          set -euo pipefail
          api_key="$(node -e 'const s=require("fs").readFileSync("src/services/firebase.js","utf8");const line=s.split(String.fromCharCode(10)).find(x=>x.includes("apiKey:"));if(!line)process.exit(1);process.stdout.write(line.split(String.fromCharCode(34))[1]);')"
          signup="$(mktemp)"
          signup_status="$(curl --silent --show-error --output "$signup" --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{"returnSecureToken":true}' "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$api_key")"
          if [ "$signup_status" != "200" ]; then
            echo "Temporary anonymous Firebase test sign-in unavailable (HTTP $signup_status)"
            jq -r '.error.message // "Unknown sign-in error"' "$signup" | head -c 120
            echo
            rm -f "$signup"
            exit 0
          fi
          token="$(jq -r .idToken "$signup")"
          rm -f "$signup"
          cleanup() {
            curl --silent --show-error -X POST -H 'content-type: application/json' --data "$(jq -nc --arg t "$token" '{idToken:$t}')" "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$api_key" >/dev/null || true
          }
          trap cleanup EXIT
          for fn in getPremiumStatus getReceiptStatus; do
            url="$(gcloud functions describe "$fn" --gen2 --region=us-central1 --project=stop-tracker-v1 --format='value(serviceConfig.uri)')"
            output="$(mktemp)"
            status="$(curl --silent --show-error --max-time 25 --output "$output" --write-out '%{http_code}' -X POST -H 'content-type: application/json' -H "Authorization: Bearer $token" --data '{"data":{}}' "$url")"
            echo "Signed-in anonymous check $fn HTTP $status"
            if [ "$status" = "200" ]; then
              jq -c '{isPro:.result.isPro,betaAccess:.result.betaAccess,enabled:.result.enabled,validResponse:(.result!=null)}' "$output"
            else
              jq -c '{code:.error.status,message:.error.message}' "$output" 2>/dev/null | head -c 260 || true
              echo
            fi
            rm -f "$output"
          done
      - name: Verify beta access for disposable non-guest account
        shell: bash
        run: |
          set -euo pipefail
          api_key="$(node -e 'const s=require("fs").readFileSync("src/services/firebase.js","utf8");const line=s.split(String.fromCharCode(10)).find(x=>x.includes("apiKey:"));if(!line)process.exit(1);process.stdout.write(line.split(String.fromCharCode(34))[1]);')"
          email="st-health-$(openssl rand -hex 10)@example.invalid"
          password="$(openssl rand -hex 20)"
          response="$(mktemp)"
          payload="$(jq -nc --arg e "$email" --arg p "$password" '{email:$e,password:$p,returnSecureToken:true}')"
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data "$payload" "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$api_key")"
          if [ "$code" != "200" ]; then
            echo "Disposable email test account unavailable (HTTP $code)"
            jq -r '.error.message // "Unable to create test account"' "$response" | head -c 100 || true
            echo
            rm -f "$response"
            exit 0
          fi
          token="$(jq -r .idToken "$response")"
          rm -f "$response"
          cleanup() {
            curl --silent --show-error -X POST -H 'content-type: application/json' --data "$(jq -nc --arg t "$token" '{idToken:$t}')" "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$api_key" >/dev/null || true
          }
          trap cleanup EXIT
          url="$(gcloud functions describe getPremiumStatus --gen2 --region=us-central1 --project=stop-tracker-v1 --format='value(serviceConfig.uri)')"
          output="$(mktemp)"
          status="$(curl --silent --show-error --max-time 25 --output "$output" --write-out '%{http_code}' -X POST -H 'content-type: application/json' -H "Authorization: Bearer $token" --data '{"data":{}}' "$url")"
          echo "Non-guest beta status HTTP $status"
          if [ "$status" = "200" ]; then
            jq -c '{betaAccess: .result.betaAccess, isPro: .result.isPro, validUses:(.result.statementAiUses!=null)}' "$output"
          else
            jq -c '{status: .error.status, message: .error.message}' "$output" | head -c 240 || true
            echo
          fi
          rm -f "$output"
      - name: Run one synthetic statement through DeepSeek (no user files)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/st-synthetic-venv
          /tmp/st-synthetic-venv/bin/pip -q install pillow
          /tmp/st-synthetic-venv/bin/python - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          import io,base64,json
          # Complex, fabricated 23-row statement: no customer documents.
          from datetime import date,timedelta
          img=Image.new("RGB",(1600,1900),"white")
          d=ImageDraw.Draw(img)
          try: font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",25)
          except OSError: font=ImageFont.load_default()
          lines=["TEST ONLY - FICTIONAL CONTRACTOR PAY STATEMENT",
                 "Period: 14 Sep 2026 to 11 Oct 2026",
                 "DATE       ROUTE   STOPS  PARCELS     GROSS"]
          start=date(2026,9,14)
          for i in range(23):
            day=start+timedelta(days=i)
            lines.append(f"{day.isoformat()}    232    {100+i:3d}     {110+i:3d}     GBP {208.50+i*2:.2f}")
          lines.extend([
             "EXTRA WORK - GBP 150.00",
             "TOTAL GROSS WORK EARNINGS - GBP 5900.00",
             "CONTRACTOR FRANCHISE FEE - GBP 354.00",
             "LEASE COST - GBP 200.00",
             "INSURANCE - GBP 50.00",
             "FUEL COST - GBP 200.00",
             "TOTAL OTHER CONTRACTOR CHARGES - GBP 450.00",
             "FINAL CONTRACTOR PAYOUT - GBP 5096.00",
             "VAT - EXCLUDED"])
          for i,line in enumerate(lines): d.text((35,24+51*i),line,font=font,fill="black")
          buf=io.BytesIO();img.save(buf,format="PNG")
          payload={"data":{"images":[{"mimeType":"image/png","fileBase64":base64.b64encode(buf.getvalue()).decode("ascii")}]}}
          with open("/tmp/st-synthetic-payload.json","w") as out:json.dump(payload,out)
          PY
          api_key="$(node -e 'const s=require("fs").readFileSync("src/services/firebase.js","utf8");const line=s.split(String.fromCharCode(10)).find(x=>x.includes("apiKey:"));if(!line)process.exit(1);process.stdout.write(line.split(String.fromCharCode(34))[1]);')"
          email="st-ai-probe-$(openssl rand -hex 12)@example.invalid"
          password="$(openssl rand -hex 20)"
          register="$(mktemp)"
          body="$(jq -nc --arg e "$email" --arg p "$password" '{email:$e,password:$p,returnSecureToken:true}')"
          sign_code="$(curl --max-time 20 --silent --show-error -o "$register" -w '%{http_code}' -H 'content-type: application/json' -d "$body" "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$api_key")"
          if [ "$sign_code" != "200" ]; then
            echo "Synthetic test could not create temporary Firebase identity (HTTP $sign_code)."
            rm -f "$register" /tmp/st-synthetic-payload.json
            exit 1
          fi
          token="$(jq -r .idToken "$register")"
          rm -f "$register"
          cleanup() {
            curl --silent --show-error -H 'content-type: application/json' -d "$(jq -nc --arg t "$token" '{idToken:$t}')" "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$api_key" >/dev/null || true
            rm -f /tmp/st-synthetic-payload.json
          }
          trap cleanup EXIT
          url="$(gcloud functions describe extractStatement --gen2 --region=us-central1 --project=stop-tracker-v1 --format='value(serviceConfig.uri)')"
          result="$(mktemp)"
          response_code="$(curl --max-time 116 --silent --show-error -o "$result" -w '%{http_code}' -H 'content-type: application/json' -H "Authorization: Bearer $token" --data-binary @/tmp/st-synthetic-payload.json "$url")"
          echo "Synthetic DeepSeek extraction HTTP $response_code"
          if [ "$response_code" = "200" ]; then
            jq -c '{hasResult:(.result!=null),hasStops:(.result.statementStops!=null),hasGross:(.result.statementAmount!=null),hasPayout:(.result.contractorPayout!=null),mode:(.result.extractionMode//"detailed"),dailyRows:(.result.daily|length)}' "$result"
          else
            jq -c '{code:.error.status,message:.error.message}' "$result" | head -c 350 || true
            echo
          fi
          rm -f "$result"
      - name: Check error log access without printing customer data
        shell: bash
        run: |
          set +e
          response="$(gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="getpremiumstatus" AND severity>=ERROR' --project=stop-tracker-v1 --limit=4 --format=json 2>&1)"
          status=$?
          if [ "$status" -eq 0 ]; then
            printf '%s' "$response" | jq '[.[] | {severity: .severity, timestamp: .timestamp, statusCode: .httpRequest.status, hasErrorMessage: (.textPayload != null or .jsonPayload != null)}]'
          else
            echo "Cloud Logging read unavailable for deployment account (no customer data printed)."
            printf '%s' "$response" | sed -n '/PERMISSION_DENIED/p' | head -c 320
            echo
          fi
