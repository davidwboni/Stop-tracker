name: Diagnose Firebase callable runtime permissions
on:
  push:
    branches:
      - diagnose/firebase-premium-status-20261021
    paths:
      - .github/workflows/firebase-premium-diagnostics.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOP_TRACKER_V1 }}
          project_id: stop-tracker-v1
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read callable runtime identity and deployment state
        shell: bash
        run: |
          set -euo pipefail
          for fn in getPremiumStatus getReceiptStatus extractStatement; do
            echo "--- $fn ---"
            gcloud functions describe "$fn" --gen2 --region=us-central1 --project=stop-tracker-v1 --format=json |
              jq '{state: .state, runtimeServiceAccount: .serviceConfig.serviceAccountEmail, availableMemory: .serviceConfig.availableMemory, ingress: .serviceConfig.ingressSettings, uriConfigured: (.serviceConfig.uri != null)}'
          done
      - name: Probe callable endpoint invocation and CORS without customer credentials
        shell: bash
        run: |
          set -euo pipefail
          for fn in getPremiumStatus getReceiptStatus; do
            url="$(gcloud functions describe "$fn" --gen2 --region=us-central1 --project=stop-tracker-v1 --format='value(serviceConfig.uri)')"
            echo "--- $fn unauthenticated callable probe ---"
            result="$(mktemp)"
            status="$(curl --max-time 20 --silent --show-error --output "$result" --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{"data":{}}' "$url" || true)"
            echo "HTTP $status"
            jq -c '{status: .error.status, message: .error.message}' "$result" 2>/dev/null | head -c 240 || true
            echo
            rm -f "$result"
            result="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl --max-time 20 --silent --show-error --output "$result" --dump-header "$headers" --write-out '%{http_code}' -X OPTIONS -H 'Origin: https://stop-tracker.vercel.app' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type,authorization' "$url" || true)"
            echo "CORS preflight HTTP $status"
            grep -i '^access-control-allow-origin:' "$headers" | tr -d '\r' | head -c 150 || true
            echo
            rm -f "$result" "$headers"
            echo "Cloud Run IAM public invoker (if permitted):"
            iam="$(gcloud run services get-iam-policy "$(echo "$fn" | tr '[:upper:]' '[:lower:]')" --region=us-central1 --project=stop-tracker-v1 --format=json 2>/dev/null)"
            if [ $? -eq 0 ] && [ -n "$iam" ]; then
              printf '%s' "$iam" | jq -c '[.bindings[]? | select(.role == "roles/run.invoker") | .members[]? | select(.=="allUsers")] | length > 0'
            else
              echo "IAM policy not readable by deployment identity"
            fi
          done
      - name: Repair callable HTTP invocation for receipt AI (Firebase auth remains mandatory)
        shell: bash
        run: |
          set -euo pipefail
          for service in getreceiptstatus extractexpensereceipt; do
            echo "Granting unauthenticated Cloud Run transport access to $service; callable handler enforces Firebase Auth."
            gcloud run services add-iam-policy-binding "$service" --region=us-central1 --project=stop-tracker-v1 --member=allUsers --role=roles/run.invoker --quiet
            policy="$(gcloud run services get-iam-policy "$service" --region=us-central1 --project=stop-tracker-v1 --format=json)"
            printf '%s' "$policy" | jq -e '[.bindings[]? | select(.role=="roles/run.invoker") | .members[]? | select(.=="allUsers")] | length>0' >/dev/null
            echo "Confirmed public HTTP transport permission on $service"
          done
      - name: Confirm both receipt endpoints still require Firebase login
        shell: bash
        run: |
          set -euo pipefail
          for fn in getReceiptStatus extractExpenseReceipt; do
            url="$(gcloud functions describe "$fn" --gen2 --region=us-central1 --project=stop-tracker-v1 --format='value(serviceConfig.uri)')"
            output="$(mktemp)"
            status="$(curl --max-time 25 --silent --show-error --output "$output" --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{"data":{}}' "$url")"
            echo "$fn HTTP $status (unsigned must be 401)"
            if [ "$status" != "401" ]; then
              jq -c '{error: .error.status}' "$output" 2>/dev/null || true
              rm -f "$output"
              exit 1
            fi
            rm -f "$output"
          done
      - name: Check error log access without printing customer data
        shell: bash
        run: |
          set +e
          response="$(gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="getpremiumstatus" AND severity>=ERROR' --project=stop-tracker-v1 --limit=4 --format=json 2>&1)"
          status=$?
          if [ "$status" -eq 0 ]; then
            printf '%s' "$response" | jq '[.[] | {severity: .severity, timestamp: .timestamp, statusCode: .httpRequest.status, hasErrorMessage: (.textPayload != null or .jsonPayload != null)}]'
          else
            echo "Cloud Logging read unavailable for deployment account (no customer data printed)."
            printf '%s' "$response" | sed -n '/PERMISSION_DENIED/p' | head -c 320
            echo
          fi
