name: Firebase AI beta one-time deployment
on:
  push:
    branches: [deploy/firebase-ai-beta-20261021]
    paths:
      - .github/workflows/firebase-ai-beta-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-ai-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify deploy credential exists
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOP_TRACKER_V1 }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_STOP_TRACKER_V1 GitHub Actions secret. No Firebase deployment attempted."
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOP_TRACKER_V1 }}
          project_id: stop-tracker-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Check Functions
        working-directory: functions
        run: |
          npm ci --ignore-scripts
          node --check index.js
          node --test
      - name: Deploy six AI and route callables to verified project
        run: |
          npx --yes firebase-tools@latest deploy \
            --project stop-tracker-v1 \
            --only functions:getPremiumStatus,functions:extractStatement,functions:getReceiptStatus,functions:extractExpenseReceipt,functions:optimizeDriverRoute,functions:consumeRouteOptimization \
            --non-interactive
