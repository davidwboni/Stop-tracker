name: Firebase AI beta one-time deployment
on:
  push:
    branches: [deploy/firebase-ai-beta-20261021]
    paths:
      - .github/workflows/firebase-ai-beta-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-ai-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify deploy credential exists
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOP_TRACKER_V1 }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_STOP_TRACKER_V1 GitHub Actions secret. No Firebase deployment attempted."
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOP_TRACKER_V1 }}
          project_id: stop-tracker-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Check Functions
        working-directory: functions
        run: |
          npm ci --ignore-scripts
          node --check index.js
          node --test
      - name: Inspect Cloud Functions list permissions (no secrets printed)
        uses: google-github-actions/setup-gcloud@v2
      - name: Verify list access against v1 and v2 APIs
        shell: bash
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          for version in v1 v2; do
            response="$(mktemp)"
            status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              --header "Authorization: Bearer $access_token" \
              "https://cloudfunctions.googleapis.com/$version/projects/stop-tracker-v1/locations/-/functions")"
            echo "Cloud Functions $version list HTTP $status"
            if [ "$status" != "200" ]; then
              jq -r '.error.message // .error.status // "Function listing was rejected"' "$response" | head -c 500
              echo
            fi
            rm -f "$response"
          done
          unset access_token
      - name: Diagnose Firestore and Storage resource access
        shell: bash
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          endpoints=(
            "https://firestore.googleapis.com/v1/projects/stop-tracker-v1/databases/%28default%29"
            "https://storage.googleapis.com/storage/v1/b/stop-tracker-v1.appspot.com?fields=name,location"
            "https://storage.googleapis.com/storage/v1/b/stop-tracker-v1.firebasestorage.app?fields=name,location"
            "https://firebasestorage.googleapis.com/v1alpha/projects/stop-tracker-v1/defaultBucket"
          )
          names=("Firestore database metadata" "Legacy Storage bucket metadata" "Current Storage bucket metadata" "Firebase default Storage bucket")
          for i in "${!endpoints[@]}"; do
            output="$(mktemp)"
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' --header "Authorization: Bearer $access_token" "${endpoints[$i]}")"
            echo "${names[$i]} HTTP $status"
            if [ "$status" != "200" ]; then
              jq -r '.error.message // .error.status // "Resource lookup failed"' "$output" | head -c 700
              echo
            else
              jq -c '{name,location}' "$output" | head -c 300
              echo
            fi
            rm -f "$output"
          done
          unset access_token
      - name: Deploy six AI and route callables to verified project
        run: |
          npx --yes firebase-tools@latest deploy \
            --project stop-tracker-v1 \
            --only functions:getPremiumStatus,functions:extractStatement,functions:getReceiptStatus,functions:extractExpenseReceipt,functions:optimizeDriverRoute,functions:consumeRouteOptimization \
            --non-interactive
