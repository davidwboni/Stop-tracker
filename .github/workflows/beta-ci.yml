name: Beta CI

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta, main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json is currently behind package.json, so use install for the\n      # beta validation gate until the lockfile is regenerated cleanly.\n      - run: npm install --ignore-scripts\n      - run: npm test
      - run: npm run build
        env:
          CI: "true"

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm install --ignore-scripts
      - run: node --check index.js
