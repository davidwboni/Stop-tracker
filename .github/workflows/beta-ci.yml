name: Beta CI

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta, main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install web dependencies
        run: npm install --ignore-scripts
      # jsdom treats canvas as optional. With lifecycle scripts disabled the native
      # canvas binary is not built, so remove the unusable optional package.
      - name: Exclude unbuilt optional canvas from jsdom
        run: node -e "require('fs').rmSync('node_modules/canvas',{recursive:true,force:true})"
      - name: Run web tests
        run: npm test
      - name: Build production web bundle with syntax and output gate
        run: npm run build
        env:
          CI: "true"

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm install --ignore-scripts
      - run: node --check index.js
      - run: node --test
